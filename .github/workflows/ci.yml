name: CI

on:
  push:
    # Also run on feature branches so pushes that pre-date the PR get a
    # green / red signal without having to open the PR first.
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Third-party actions are pinned to immutable commit SHAs (movable tags
      # can be retargeted to run arbitrary code with the workflow's token).
      # Dependabot bumps the SHA + version comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # No cell, no network, about a second. It holds the guards on the
      # COMMITTED cell files (no customer-deposit opt-in, no grant to the
      # middleware's own Fineract roles) and the wiring of provision-cell.sh,
      # which only gate a merge if something runs them.
      - name: Provisioning selftest
        run: bash ./deploy/fineract/provision-selftest.sh

      - name: Build, test, and package
        run: ./mvnw -B -ntp -Dstyle.color=always verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

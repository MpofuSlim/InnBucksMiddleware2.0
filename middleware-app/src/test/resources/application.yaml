spring:
  application:
    name: innbucks-middleware
  profiles:
    active: test

innbucks:
  country: KE
  core:
    provider: fineract
  auth:
    signing-key: test-jwt-signing-key-that-is-at-least-32-bytes-long-for-hs256
    # Deliberately distinct from signing-key — ProductionSecretsGuard enforces
    # inequality in EVERY environment, tests included.
    verification-signing-key: test-verification-signing-key-at-least-32-bytes-long
    national-id-hmac-key: test-national-id-hmac-key-at-least-32-bytes-long
    audience: innbucks-mobile-test
    access-token-ttl: 10m
    refresh-token-ttl: 7d
    brute-force:
      max-failed-attempts-before-lock: 5
      lock-duration: 1h
      backoff-base: 1s
  audit:
    hmac-secret: test-audit-hmac-secret-that-is-at-least-32-bytes-long
  cors:
    allowed-origins:
      - http://localhost:3000
  idempotency:
    ttl: 1h
  ledger:
    # Long interval: tests drive the reconciler by calling sweep() directly,
    # never via the scheduler.
    reconcile-interval: PT1H
    stale-pending-threshold: PT5M
    batch-size: 100
    reconcile-backoff-base: PT1M
    reconcile-backoff-cap: PT30M
    parked-alert-threshold: PT1H
  otp:
    ttl: 5m
    max-attempts: 5
    verification-token-ttl: 5m
    hmac-secret: test-otp-hmac-secret-that-is-at-least-32-bytes-long
    fixed-code: ""
  notify:
    # Console stub: no test may hit a real SMS/WhatsApp gateway. The contract
    # tests build the gateway clients directly against WireMock.
    provider: console
    token-ttl: 10m
    connect-timeout: 1s
    read-timeout: 2s
    whatsapp:
      enabled: false
      connect-timeout: 1s
      read-timeout: 2s
    # ON in tests on purpose: the alert path is an after-commit listener on a
    # background pool, so "does it actually fire in a real context" is exactly
    # what a unit test cannot answer. Blank zone exercises the country default.
    transactions:
      enabled: true
      notify-on-failure: false
      zone: ""
      max-length: 160
      max-narrative-length: 24
  stepup:
    # Real thresholds exercised by StepUpFlowIntegrationTest: amounts >= the
    # basic threshold require approval; small movements pass untouched.
    enabled: true
    thresholds:
      basic: 50000
      standard: 200000
      enhanced: 1000000
  rate-limit:
    # Disabled in tests so repeated auth calls within one test don't trip
    # limits. RateLimiterServiceTest / AuthRateLimitFilterTest build the limiter
    # directly with enabled=true to exercise the real behaviour.
    enabled: false

# The real adapter bean boots in every @SpringBootTest context (provider is
# fineract above) but is never CALLED — tests override the port with @Primary
# stubs. The dead port makes any accidental real call fail loudly and fast.
fineract:
  base-url: http://localhost:1
  tenant-id: default
  read-username: test-read
  read-password: test-read-secret
  write-username: test-write
  write-password: test-write-secret
  office-id: 1
  savings-product-id: 1
  payment-type-id: 1
  currency: KES
  locale: en
  date-format: yyyy-MM-dd
  connect-timeout: 1s
  read-timeout: 2s
  resilience:
    enabled: false
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 3
    slow-call-duration-threshold: 8s
    retry-max-attempts: 3
    retry-wait-duration: 50ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    zw.co.innbucks.middleware: WARN

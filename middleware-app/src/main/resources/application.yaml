spring:
  application:
    name: innbucks-middleware
  # Profiles come from the SPRING_PROFILES_ACTIVE env var (Spring reads it
  # natively) — deliberately NO default profile here. ProductionSecretsGuard
  # treats an EMPTY active-profile set as a DEPLOYMENT (fail-closed): local
  # runs must opt in explicitly with SPRING_PROFILES_ACTIVE=dev.
  # Datasource MUST be supplied via env vars in every non-dev deployment.
  # No defaults here — a missing DATASOURCE_URL fails fast at startup
  # instead of silently falling back to an embedded DB. application-dev.yaml
  # overrides with localhost placeholders so a fresh clone + IDE Run "just
  # works"; prod/uat have no such overrides.
  datasource:
    url: ${DATASOURCE_URL:}
    username: ${DATASOURCE_USERNAME:}
    password: ${DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

innbucks:
  country: ${INNBUCKS_COUNTRY:}
  # Which core banking system this cell fronts (fineract | veengu). Read by
  # the adapter wiring once the Fineract adapter lands; every deployment cell
  # pins exactly one (country, core) pair.
  core:
    provider: ${INNBUCKS_CORE_PROVIDER:fineract}
  auth:
    signing-key: ${JWT_SIGNING_KEY:}
    # MUST be a DIFFERENT secret from signing-key — it signs OTP verification /
    # step-up tokens only. Equal keys = whoever mints access tokens can mint
    # PIN-reset tokens (account takeover); the guard refuses to boot on equality.
    verification-signing-key: ${VERIFICATION_SIGNING_KEY:}
    national-id-hmac-key: ${NATIONAL_ID_HMAC_KEY:}
    audience: ${JWT_AUDIENCE:innbucks-mobile}
    access-token-ttl: ${JWT_ACCESS_TTL:10m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    # Staged HS256 -> RS256 migration (all optional; defaults keep HS256):
    #  (1) set JWT_PUBLIC_KEY everywhere + roll -> verifiers accept both algs
    #  (2) set JWT_SIGNING_ALG=RS256 + JWT_PRIVATE_KEY here + roll -> mint flips
    #  (3) >= max token TTL later, retire JWT_SIGNING_KEY
    # Keys are PEM (PKCS#8 private / X.509 public); literal \n escapes are fine.
    signing-algorithm: ${JWT_SIGNING_ALG:HS256}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:}
    brute-force:
      max-failed-attempts-before-lock: ${AUTH_MAX_FAILED_ATTEMPTS:7}
      lock-duration: ${AUTH_LOCK_DURATION:1h}
      backoff-base: ${AUTH_BACKOFF_BASE:1s}
  audit:
    # Keys the tamper-evidence HMAC chain over audit_event. Per-deployment,
    # openssl rand -base64 48. Rotation breaks the chain at the rotation point
    # (expected; the verifier tickets it) — content HMACs of new rows are what
    # matter forensically.
    hmac-secret: ${AUDIT_HMAC_SECRET:}
    verify-cron: ${AUDIT_VERIFY_CRON:0 45 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:24h}
  ledger:
    # How often the reconciler sweeps (fixed-delay). Stale PENDING rows are
    # parked as UNKNOWN after stale-pending-threshold; parked/in-flight rows
    # are polled against the core with exponential backoff (base doubling per
    # attempt up to cap); UNKNOWN rows older than parked-alert-threshold
    # trip the operator alarm (innbucks.ledger.parked_overdue) every sweep.
    reconcile-interval: ${LEDGER_RECONCILE_INTERVAL:PT1M}
    stale-pending-threshold: ${LEDGER_STALE_PENDING_THRESHOLD:PT5M}
    batch-size: ${LEDGER_BATCH_SIZE:100}
    reconcile-backoff-base: ${LEDGER_RECONCILE_BACKOFF_BASE:PT1M}
    reconcile-backoff-cap: ${LEDGER_RECONCILE_BACKOFF_CAP:PT30M}
    parked-alert-threshold: ${LEDGER_PARKED_ALERT_THRESHOLD:PT1H}
  otp:
    ttl: ${OTP_TTL:5m}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    verification-token-ttl: ${OTP_VERIFICATION_TOKEN_TTL:5m}
    # Keys the HMAC over stored OTP codes — a bare hash of a 6-digit space is
    # trivially reversible from a DB read. Per-deployment secret.
    hmac-secret: ${OTP_HMAC_SECRET:}
    # DEV ONLY. When set, every OTP becomes this exact value. Refuses to start
    # outside the dev/test profile if set. Leave empty for random codes.
    fixed-code: ${OTP_FIXED_CODE:}
  notify:
    # SmsSender selection: console (no-network stub — dev/UAT only, OTP codes
    # appear in logs, customers get NOTHING) | innbucks-gateway (the InnBucks
    # notification API — the go-live requirement; then URL/key/username/
    # password are boot-required). A deployment profile on 'console' logs a
    # page-worthy ERROR at startup.
    provider: ${NOTIFY_PROVIDER:console}
    base-url: ${NOTIFY_API_URL:}
    api-key: ${NOTIFY_API_KEY:}
    username: ${NOTIFY_API_USERNAME:}
    password: ${NOTIFY_API_PASSWORD:}
    # Fallback bearer-token lifetime when the gateway JWT's exp can't be parsed.
    token-ttl: ${NOTIFY_TOKEN_TTL:10m}
    connect-timeout: ${NOTIFY_CONNECT_TIMEOUT:2s}
    read-timeout: ${NOTIFY_READ_TIMEOUT:10s}
    # Optional WhatsApp fallback: when the SMS gateway rejects a send or is
    # unreachable, the same message rides the external WhatsApp notification
    # gateway instead (x-api-key auth). Delivery fails only if BOTH channels do.
    whatsapp:
      enabled: ${WHATSAPP_FALLBACK_ENABLED:false}
      base-url: ${WHATSAPP_GATEWAY_URL:}
      api-key: ${WHATSAPP_API_KEY:}
      connect-timeout: ${WHATSAPP_CONNECT_TIMEOUT:2s}
      read-timeout: ${WHATSAPP_READ_TIMEOUT:10s}
    # Customer transaction alerts — one SMS after money actually moves, on the
    # same SmsSender (and so the same WhatsApp fallback) as OTP. COSTS MONEY
    # PER MESSAGE: a deposit/withdrawal is one SMS, a transfer between two
    # customers of this cell is two. Sent AFTER the ledger row commits
    # terminal, on a bounded background pool, and a delivery failure can never
    # affect the movement.
    transactions:
      enabled: ${TXN_ALERTS_ENABLED:true}
      # Also alert the INITIATOR when a movement positively failed. Off by
      # default — the app already shows the error, and a core outage would
      # otherwise SMS everyone who tried. Never sent to a transfer recipient.
      notify-on-failure: ${TXN_ALERTS_ON_FAILURE:false}
      # Timestamp rendering only; storage/logs stay UTC. Blank = the
      # deployment country's civil zone (ZW -> Africa/Harare, KE ->
      # Africa/Nairobi), which is right for any single-country cell.
      zone: ${TXN_ALERTS_ZONE:}
      # 160 = one billed GSM-7 segment. The narration clause is dropped (the
      # alert still sends) rather than spill into a second segment.
      max-length: ${TXN_ALERTS_MAX_LENGTH:160}
      max-narrative-length: ${TXN_ALERTS_MAX_NARRATIVE:24}
  stepup:
    # SMS re-approval of high-value withdrawals/transfers (deposits never step
    # up). A movement >= the caller's KYC-tier threshold (MINOR units of the
    # cell currency) 403s with step_up_required + a txnFp; the app approves it
    # via /auth/step-up/request + /verify and retries with X-Step-Up-Token.
    enabled: ${STEPUP_ENABLED:true}
    thresholds:
      # Defaults assume 2-decimal minor units: 500.00 / 2,000.00 / 10,000.00.
      basic: ${STEPUP_THRESHOLD_BASIC:50000}
      standard: ${STEPUP_THRESHOLD_STANDARD:200000}
      enhanced: ${STEPUP_THRESHOLD_ENHANCED:1000000}
  rate-limit:
    # Per-instance, in-memory token buckets on the public auth surface. Disable
    # only for local debugging; staging/prod should keep this on.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Default false: the deployed topology publishes 8090 directly, so the
    # socket peer IS the client. Set true ONLY behind a trusted proxy/LB that
    # sets X-Forwarded-For — the header is otherwise client-spoofable.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    # How many proxies sit between the internet and this app (nginx alone = 1;
    # Cloudflare + nginx = 2; add one for every extra hop, e.g. a serverless
    # FE proxy in front). The client IP is taken that many entries from the
    # RIGHT of X-Forwarded-For — the last entry a caller cannot forge. 0 keeps
    # the old leftmost-entry behaviour, which ANY caller can set, and logs a
    # loud warning at startup. Counting only helps while the origin refuses
    # traffic that did not come through those proxies — firewall it.
    trusted-proxy-count: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:0}
    # capacity = requests allowed per refill-period (greedy refill).
    ip-login:
      capacity: ${RATE_LIMIT_IP_LOGIN_CAPACITY:15}
      refill-period: ${RATE_LIMIT_IP_LOGIN_WINDOW:1m}
    ip-refresh:
      capacity: ${RATE_LIMIT_IP_REFRESH_CAPACITY:30}
      refill-period: ${RATE_LIMIT_IP_REFRESH_WINDOW:1m}
    ip-otp-request:
      capacity: ${RATE_LIMIT_IP_OTP_REQUEST_CAPACITY:10}
      refill-period: ${RATE_LIMIT_IP_OTP_REQUEST_WINDOW:1m}
    ip-otp-verify:
      capacity: ${RATE_LIMIT_IP_OTP_VERIFY_CAPACITY:20}
      refill-period: ${RATE_LIMIT_IP_OTP_VERIFY_WINDOW:1m}
    ip-pin:
      capacity: ${RATE_LIMIT_IP_PIN_CAPACITY:15}
      refill-period: ${RATE_LIMIT_IP_PIN_WINDOW:1m}
    # Public + creates core-banking state: the tightest bucket.
    ip-register:
      capacity: ${RATE_LIMIT_IP_REGISTER_CAPACITY:5}
      refill-period: ${RATE_LIMIT_IP_REGISTER_WINDOW:15m}
    # Per-MSISDN OTP-request cap (SMS-flood control): few sends per number per
    # window, independent of source IP.
    msisdn-otp-request:
      capacity: ${RATE_LIMIT_MSISDN_OTP_REQUEST_CAPACITY:3}
      refill-period: ${RATE_LIMIT_MSISDN_OTP_REQUEST_WINDOW:15m}
    # Per-CUSTOMER budget on the phone->recipient lookup (POST /accounts/lookup).
    # 15/min covers any honest transfer flow; at that rate sweeping a country's
    # number space takes years per account. Watch innbucks.recipient.lookup.
    customer-lookup:
      capacity: ${RATE_LIMIT_CUSTOMER_LOOKUP_CAPACITY:15}
      refill-period: ${RATE_LIMIT_CUSTOMER_LOOKUP_WINDOW:1m}
  security:
    # Credential-spray detection: the brute-force shape the per-account lockout
    # and the per-IP buckets both miss — one source trying a few PINs against
    # MANY different accounts, staying under every individual limit.
    #
    # The thresholds count DISTINCT ACCOUNTS per source, never attempts: behind
    # NAT (an office, a carrier CGNAT) failures from one address are normal,
    # but failures against thirty different accounts in fifteen minutes are not.
    anomaly:
      enabled: ${AUTH_ANOMALY_ENABLED:true}
      window: ${AUTH_ANOMALY_WINDOW:15m}
      # Alert only — a log line, a metric and one audit row.
      distinct-subjects-alert: ${AUTH_ANOMALY_ALERT_THRESHOLD:10}
      # Block the source from the auth endpoints. Must be >= the alert level.
      distinct-subjects-block: ${AUTH_ANOMALY_BLOCK_THRESHOLD:30}
      block-duration: ${AUTH_ANOMALY_BLOCK_DURATION:15m}
      # Set false to run observe-only while tuning thresholds on real traffic.
      block-enabled: ${AUTH_ANOMALY_BLOCK_ENABLED:true}
      # The detector must not become the memory-exhaustion vector it defends
      # against: both maps are hard-capped.
      max-tracked-sources: ${AUTH_ANOMALY_MAX_SOURCES:50000}
      max-subjects-per-source: ${AUTH_ANOMALY_MAX_SUBJECTS_PER_SOURCE:1000}

# Fineract cell wiring — only read when innbucks.core.provider=fineract, and
# then every field is boot-required (fail-fast, like INNBUCKS_COUNTRY). TWO
# least-privilege AppUsers: the read credential holds READ_* permissions only;
# the write credential exactly the command permissions the adapter calls —
# never ALL_FUNCTIONS. A leaked reconciliation credential cannot move money.
fineract:
  base-url: ${FINERACT_BASE_URL:}
  tenant-id: ${FINERACT_TENANT_ID:default}
  read-username: ${FINERACT_READ_USERNAME:}
  read-password: ${FINERACT_READ_PASSWORD:}
  write-username: ${FINERACT_WRITE_USERNAME:}
  write-password: ${FINERACT_WRITE_PASSWORD:}
  office-id: ${FINERACT_OFFICE_ID:1}
  savings-product-id: ${FINERACT_SAVINGS_PRODUCT_ID:}
  payment-type-id: ${FINERACT_PAYMENT_TYPE_ID:}
  currency: ${FINERACT_CURRENCY:}
  # Shared secret for the inbound Fineract web hook (core-initiated movement
  # alerts). Blank = webhook disabled, warned at boot. Fineract's hook can set
  # no auth header, so this token IS the auth, carried in the URL path; the
  # endpoint answers 404 to any other value. Generate: openssl rand -hex 32.
  # provision-cell.sh registers the hook with the same value.
  core-events-token: ${FINERACT_CORE_EVENTS_TOKEN:}
  locale: ${FINERACT_LOCALE:en}
  date-format: ${FINERACT_DATE_FORMAT:yyyy-MM-dd}
  connect-timeout: ${FINERACT_CONNECT_TIMEOUT:2s}
  read-timeout: ${FINERACT_READ_TIMEOUT:10s}
  # Circuit breaker + read-only retry (writes are NEVER auto-retried; the
  # propagated Idempotency-Key is the dedup, not an excuse to retry).
  resilience:
    enabled: ${FINERACT_RESILIENCE_ENABLED:true}
    sliding-window-size: ${FINERACT_CB_WINDOW:20}
    minimum-number-of-calls: ${FINERACT_CB_MIN_CALLS:10}
    failure-rate-threshold: ${FINERACT_CB_FAILURE_RATE:50}
    wait-duration-in-open-state: ${FINERACT_CB_OPEN_WAIT:30s}
    permitted-calls-in-half-open-state: ${FINERACT_CB_HALF_OPEN_CALLS:3}
    slow-call-duration-threshold: ${FINERACT_CB_SLOW_CALL:8s}
    retry-max-attempts: ${FINERACT_RETRY_MAX_ATTEMPTS:3}
    retry-wait-duration: ${FINERACT_RETRY_WAIT:200ms}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        # `loggers` is intentionally OMITTED — the endpoint accepts POST to
        # mutate log levels at runtime; exposing it on an unauthenticated
        # management port lets anyone reachable on 9090 flip client logging
        # to DEBUG and exfiltrate PII (PINs, MSISDNs, JWT headers, core-banking
        # request bodies) via the logs. Re-enable only behind authn.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

logging:
  pattern:
    level: "%5p [%X{country:-},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"
  level:
    zw.co.innbucks.middleware: INFO

springdoc:
  # The internal core-event webhook must not appear in the API doc: its path
  # embeds the shared-secret token as a template variable, and an internal
  # surface documented on a public Swagger page invites probing. Per-profile
  # files toggle Swagger on/off; this exclusion applies everywhere.
  paths-to-exclude: /internal/**
